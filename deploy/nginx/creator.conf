# Creator Agent Studio —— Nginx 反向代理样例
#
# 安装：
#   sudo cp deploy/nginx/creator.conf /etc/nginx/conf.d/creator.conf
#   # 改 server_name 为你的域名 / 内网主机名，然后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么需要反向代理：应用默认只监听 127.0.0.1:8787（安全默认，见 HOST 说明），
# 其他主机要访问就必须由同机的 Nginx（或 Caddy）转发；这也让 TLS、域名与访问
# 控制集中在一处，应用侧零改动。
#
# SSE（`/api/tasks/{id}/events` 事件流）是长连接：
#   * `proxy_buffering off`：缓冲会把事件「攒着不发」，前端看起来像卡死；
#   * `proxy_read_timeout` / `proxy_send_timeout` 3600s：创作期间事件间隔可能
#     长达分钟级，用默认 60s 会在长任务里周期性断流。
# scripts/check_deploy.py 对以上两项做静态核验，改配置时不要删。

server {
    listen 80;
    server_name creator.example.com;   # 换成你的域名（内网主机名亦可）

    # 建议：certbot --nginx -d creator.example.com 一键签发证书并自动补 443 段；
    # 纯内网不启用 TLS 时本段即可工作。

    client_max_body_size 20m;          # Brief 素材以 data URL 内联时请求体偏大

    location / {
        proxy_pass http://127.0.0.1:8787;   # 端口与 PORT 默认值一致（应用只监听本机）

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭响应缓冲 + 够长的读 / 写超时（见文件头说明）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}